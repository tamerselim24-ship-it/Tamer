name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Unzip project
        run: unzip -q egx_trader.zip
      - name: Build
        working-directory: egx_trader
        run: |
          flutter create . --platforms=android
          rm -f test/widget_test.dart
          flutter pub get
          flutter test
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: egx-trader-apk
          path: egx_trader/build/app/outputs/flutter-apk/app-release.apk
